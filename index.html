<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Finanzas Reset</title>
<!-- La app ya tiene modo oscuro propio: evita que Samsung Internet "oscurezca" colores e imágenes. -->
<meta name="color-scheme" content="light dark" />
<meta name="description" content="Centro de control financiero personal y de negocios — Code-Reset" />

<!-- Tema: se aplica antes de pintar para evitar el destello blanco en modo oscuro. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("fr.theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0B0B0D" media="(prefers-color-scheme: dark)" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Finanzas" />

<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<!-- ===================== ARRANQUE ===================== -->
<div id="splash" class="splash" aria-label="Cargando">
  <img src="assets/icon-192.png" alt="" class="splash__logo" />
</div>

<!-- ===================== PANTALLA DE LOGIN ===================== -->
<section id="login-screen" class="screen" hidden>
  <div class="login-card">
    <img src="assets/icon-192.png" alt="Finanzas Reset" class="login-logo" />
    <h1 class="login-title">CODE-RESET</h1>
    <p class="login-subtitle" id="app-name-slot">Finanzas Reset</p>

    <form id="login-form" autocomplete="on">
      <label class="field">
        <span>Correo</span>
        <input type="email" id="login-email" required autocomplete="username" inputmode="email" />
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input type="password" id="login-password" required autocomplete="current-password" />
      </label>
      <p id="login-error" class="error-text" role="alert" hidden></p>
      <button type="submit" id="login-btn" class="btn-login">Entrar</button>
      <button type="button" id="login-olvide" class="link-login">¿Olvidaste tu contraseña?</button>
    </form>

    <footer class="login-footer">
      <p>Desarrollado por: <strong>Ing. Luis Ángel Díaz Bernal</strong></p>
      <p>Compañía: <strong>CODE-RESET</strong></p>
    </footer>
  </div>
</section>

<!-- ===================== SHELL DE LA APP ===================== -->
<section id="app-shell" class="shell" hidden>
  <!-- Sidebar (tablet / desktop) -->
  <aside class="sidebar" aria-label="Navegación principal">
    <div class="sidebar__marca">
      <img src="assets/icon-192.png" alt="" class="sidebar__logo" />
      <span>Finanzas Reset</span>
    </div>
    <button type="button" class="btn btn--primario btn--bloque sidebar__nuevo" data-accion="nuevo-movimiento">+ Nuevo movimiento</button>
    <nav id="sidebar-nav" class="sidebar__nav"></nav>
    <div class="sidebar__pie">
      <span id="usuario-email" class="sidebar__usuario"></span>
      <button type="button" class="btn-texto" data-accion="cerrar-sesion">Cerrar sesión</button>
    </div>
  </aside>

  <div class="shell__principal">
    <header class="topbar">
      <h1 id="titulo-pantalla" class="topbar__titulo">Inicio</h1>
      <span id="sync-estado" class="sync" role="status" hidden></span>
    </header>
    <main id="app-content" class="contenido" tabindex="-1">
      <!-- router.js inyecta aquí la vista activa -->
    </main>
  </div>

  <!-- Barra inferior (móvil) -->
  <nav id="tabbar" class="tabbar" aria-label="Navegación principal"></nav>
</section>

<script type="module" src="js/app.js"></script>
</body>
</html>
